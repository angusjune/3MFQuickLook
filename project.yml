name: ThreeMFQuickLook
options:
  bundleIdPrefix: com.angusjune
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Notarization requires the hardened runtime; keeping it on everywhere
    # matches Xcode's default for new projects (debugging still works via the
    # injected get-task-allow entitlement in Debug).
    ENABLE_HARDENED_RUNTIME: YES
    # Local-build defaults. Release builds are stamped by scripts/release.sh
    # (MARKETING_VERSION = tag without "v", CURRENT_PROJECT_VERSION = commit
    # count — the monotonically increasing number Sparkle compares).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"

packages:
  ThreeMFKit:
    path: Packages/ThreeMFKit
  ThreeMFViewer:
    path: Packages/ThreeMFViewer
  HostAppKit:
    path: Packages/HostAppKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

targets:
  ThreeMFQuickLook:
    type: application
    platform: macOS
    sources:
      - App
      # Sparkle and ZIPFoundation are MIT-family: their notices must ship "in
      # all copies", which means inside the distributed app, not just in the
      # repo. Regenerate with scripts/collect_licenses.sh after bumping a
      # dependency.
      - path: THIRD-PARTY-LICENSES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: 3MF QuickLook
        PRODUCT_MODULE_NAME: ThreeMFQuickLook
        # App/Assets.xcassets is picked up by the App source directory above.
        # Regenerate the artwork with `swift scripts/generate_art.swift`.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ThreeMFKit
      - package: ThreeMFViewer
      - package: HostAppKit
      - package: Sparkle
      - target: PreviewExt
        embed: true
      - target: ThumbExt
        embed: true
    entitlements:
      path: App/App.entitlements
      properties:
        # The Host App is deliberately NOT sandboxed (ADR-0004): pkd refuses
        # PluginKit discovery to sandboxed callers, and onboarding's extension
        # status detection depends on it. Both extensions stay sandboxed.
        # Unsandboxed, Sparkle needs none of its sandbox workarounds; if this
        # ever flips back to true, also restore network-client, the -spks/-spki
        # mach-lookup exceptions, and SUEnableInstallerLauncherService
        # (https://sparkle-project.org/documentation/sandboxing/).
        com.apple.security.app-sandbox: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 3MF QuickLook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        # Sparkle 2 auto-update (ADR-0003): EdDSA-signed appcast served from
        # the repository; releases attach the DMG the enclosure points at.
        SUFeedURL: https://raw.githubusercontent.com/angusjune/3MFQuickLook/main/appcast.xml
        # REQUIRED before the first release: the EdDSA public key printed by
        # Sparkle's `generate_keys` (see docs/RELEASING.md). scripts/release.sh
        # refuses to cut a real release while this is empty.
        SUPublicEDKey: "Ykp+gzY1PWSpDZ6ZTwzx/uxcS64xaXE9bc8TVbBOtwc="
        # Required for the Preview Extension: Quick Look only consults a
        # preview appex for types its containing app declares as openable
        # document types (walking-skeleton finding — removing this silently
        # disables spacebar previews while thumbnails keep working).
        # Finder/Spotlight can classify .3mf files as io.3mf.model even though
        # LaunchServices resolves the filename extension to our exported type,
        # so the app and both appexes support both identifiers. The imported
        # declaration below makes io.3mf.model a valid identifier before
        # Quick Look validates the appex QLSupportedContentTypes arrays.
        CFBundleDocumentTypes:
          - CFBundleTypeName: 3MF Package
            LSItemContentTypes: [io.3mf.model, com.angusjune.threemf]
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
        # Our own namespaced identifier for .3mf (we import the format but own
        # this identifier). Deliberately digit-free and NOT conforming to
        # public.3d-content: that conformance can route the Quick Look panel to
        # the system's built-in 3D (USDZ) presentation instead of our
        # Preview Extension.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.angusjune.threemf
            UTTypeDescription: 3D Manufacturing Format package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [3mf]
              public.mime-type: [model/3mf]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.3mf.model
            UTTypeDescription: 3D Manufacturing Format model
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [3mf]
              public.mime-type: [model/3mf]

  PreviewExt:
    type: app-extension
    platform: macOS
    sources: [PreviewExt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angusjune.ThreeMFQuickLook.PreviewExt
    dependencies:
      - package: ThreeMFKit
      - package: ThreeMFViewer
    entitlements:
      path: PreviewExt/PreviewExt.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: PreviewExt/Info.plist
      properties:
        CFBundleDisplayName: 3MF QuickLook Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [io.3mf.model, com.angusjune.threemf]
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false

  ThumbExt:
    type: app-extension
    platform: macOS
    sources: [ThumbExt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angusjune.ThreeMFQuickLook.ThumbExt
    dependencies:
      - package: ThreeMFKit
      - package: ThreeMFViewer
    entitlements:
      path: ThumbExt/ThumbExt.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: ThumbExt/Info.plist
      properties:
        CFBundleDisplayName: 3MF QuickLook Thumbnails
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [io.3mf.model, com.angusjune.threemf]
            QLThumbnailMinimumDimension: 0

  # No dependency on the app target: that would make XcodeGen set TEST_HOST
  # and run these tests inside the app. They must run as a standalone runner
  # (the scheme builds the app first; the test launches it itself).
  SmokeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SmokeTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ThreeMFQuickLook:
    build:
      targets:
        ThreeMFQuickLook: all
    test:
      targets: [SmokeTests]
