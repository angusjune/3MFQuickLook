name: ProtoQL
options:
  bundleIdPrefix: dev.protoql
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  ProtoQL:
    type: application
    platform: macOS
    sources: [App]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ProtoQL
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "15.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Proto QL File
            LSItemContentTypes: [dev.protoql.qlproto]
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.protoql.qlproto
            UTTypeDescription: Proto QL File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [qlproto]
    dependencies:
      - target: PreviewExt
        embed: true
      - target: ThumbExt
        embed: true

  PreviewExt:
    type: app-extension
    platform: macOS
    sources: [PreviewExt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.protoql.ProtoQL.PreviewExt
    entitlements:
      path: PreviewExt/PreviewExt.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: PreviewExt/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [dev.protoql.qlproto]
            QLSupportsSearchableItems: false

  ThumbExt:
    type: app-extension
    platform: macOS
    sources: [ThumbExt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.protoql.ProtoQL.ThumbExt
    entitlements:
      path: ThumbExt/ThumbExt.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: ThumbExt/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [dev.protoql.qlproto]
            QLThumbnailMinimumDimension: 0

schemes:
  ProtoQL:
    build:
      targets:
        ProtoQL: all
